# SLSA Go builder configuration for the linux/arm64 release binary.
version: 1
env:
  - CGO_ENABLED=0
flags:
  - -trimpath
goos: linux
goarch: arm64
main: ./cmd/codex-cli
binary: codex-cli-{{ .Os }}-{{ .Arch }}
ldflags:
  - "-s -w"
  - "-X github.com/Voskan/codexsentinel/v2/internal/version.Version={{ .Env.VERSION }}"
  - "-X github.com/Voskan/codexsentinel/v2/internal/version.Commit={{ .Env.COMMIT }}"
  - "-X github.com/Voskan/codexsentinel/v2/internal/version.BuildDate={{ .Env.BUILD_DATE }}"
