# SLSA Go builder configuration for the windows/amd64 release binary.
version: 1
env:
  - CGO_ENABLED=0
flags:
  - -trimpath
goos: windows
goarch: amd64
main: ./cmd/codex-cli
binary: codex-cli-{{ .Os }}-{{ .Arch }}.exe
ldflags:
  - "-s -w"
  - "-X github.com/Voskan/codexsentinel/internal/version.Version={{ .Env.VERSION }}"
  - "-X github.com/Voskan/codexsentinel/internal/version.Commit={{ .Env.COMMIT }}"
  - "-X github.com/Voskan/codexsentinel/internal/version.BuildDate={{ .Env.BUILD_DATE }}"
