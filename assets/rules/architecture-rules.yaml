id: go.architecture.sql-in-transport-layer
title: Database Access in Transport Layer
category: architecture
severity: LOW
description: |
  An HTTP or transport package queries *sql.DB directly. Keeping storage
  access behind a repository makes handlers easier to test and secure.
match:
  pattern: "$DB.$METHOD($...)"
  filters:
    - type: type
      var: $DB
      include: ["*database/sql.DB", "*database/sql.Tx"]
    - type: package
      allow: ["handler", "handlers", "api", "transport", "web", "http", "controller", "controllers"]
suggestion: Move queries into a repository or store package and inject it into the handler.
references:
  - https://martinfowler.com/eaaCatalog/repository.html
enabled: true

---
id: go.architecture.http-in-data-layer
title: HTTP Routing in Data Layer
category: architecture
severity: LOW
description: |
  A repository or model package registers HTTP handlers, mixing transport
  concerns into the data layer.
match:
  pattern: "http.HandleFunc($...)"
  filters:
    - type: package
      allow: ["repository", "repositories", "dao", "model", "models", "store", "storage"]
suggestion: Register routes in the transport layer.
references:
  - https://en.wikipedia.org/wiki/Separation_of_concerns
enabled: true
