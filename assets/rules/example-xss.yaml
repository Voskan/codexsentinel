# Example rule showing the pattern syntax. It is disabled because the built-in
# taint-based "xss" rule already covers this case with data-flow tracking.
id: go.example.reflected-write
title: Raw Value Written to HTTP Response
category: security
severity: HIGH
cwe: CWE-79
enabled: false
description: |
  A non-constant value is written to an http.ResponseWriter without HTML
  escaping, which can lead to reflected cross-site scripting.

match:
  # $W and $X are metavariables; they match any expression.
  pattern: "$W.Write([]byte($X))"
  # Matches containing an escaping call are not reported.
  not_pattern:
    - "html.EscapeString($Y)"
    - "template.HTMLEscapeString($Y)"
  filters:
    - type: type
      var: $W
      include: ["net/http.ResponseWriter"]
    - type: non_const
      var: $X

suggestion: Render HTML with html/template or escape the value with html.EscapeString.
references:
  - https://owasp.org/www-community/attacks/xss/
  - https://pkg.go.dev/html/template
tags: [xss, example]
