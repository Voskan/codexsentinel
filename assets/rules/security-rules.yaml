id: go.security.plaintext-http-request
title: Request Sent over Plaintext HTTP
category: security
severity: MEDIUM
cwe: CWE-319
description: |
  An outgoing request uses an http:// URL to a non-local host. Credentials,
  tokens and response data can be read or modified in transit.
match:
  pattern: "http.Get($URL)"
  filters:
    - type: regex
      var: $URL
      include: ['^"http://']
      exclude: ['^"http://(localhost|127\.0\.0\.1|\[::1\])([:/"]|$)']
suggestion: Use an https:// URL.
references:
  - https://cwe.mitre.org/data/definitions/319.html
enabled: true

---
id: go.security.plaintext-http-request-new
title: Request Built for Plaintext HTTP
category: security
severity: MEDIUM
cwe: CWE-319
description: |
  An outgoing request is built for an http:// URL to a non-local host.
  Credentials, tokens and response data can be read or modified in transit.
match:
  pattern: "http.NewRequestWithContext($CTX, $METHOD, $URL, $BODY)"
  filters:
    - type: regex
      var: $URL
      include: ['^"http://']
      exclude: ['^"http://(localhost|127\.0\.0\.1|\[::1\])([:/"]|$)']
suggestion: Use an https:// URL.
references:
  - https://cwe.mitre.org/data/definitions/319.html
enabled: true

---
id: go.security.unsafe-pointer-conversion
title: unsafe.Pointer Conversion
category: security
severity: LOW
cwe: CWE-704
description: |
  Converting through unsafe.Pointer bypasses the type system and memory
  safety guarantees. Review that the conversion follows the rules in the
  unsafe package documentation.
match:
  pattern: "unsafe.Pointer($X)"
  filters:
    - type: import
      include: ["unsafe"]
suggestion: Prefer safe alternatives such as unsafe.String/unsafe.Slice with documented invariants, or avoid unsafe entirely.
references:
  - https://pkg.go.dev/unsafe#Pointer
enabled: true
