id: go.style.strings-replace-all
title: Use strings.ReplaceAll
category: style
severity: INFO
description: strings.Replace with n = -1 is clearer as strings.ReplaceAll.
pattern: "strings.Replace($S, $OLD, $NEW, -1)"
fix: "strings.ReplaceAll($S, $OLD, $NEW)"
suggestion: Use strings.ReplaceAll.
references:
  - https://pkg.go.dev/strings#ReplaceAll
enabled: true

---
id: go.style.time-since
title: Use time.Since
category: style
severity: INFO
description: time.Now().Sub(t) is clearer as time.Since(t).
pattern: "time.Now().Sub($T)"
fix: "time.Since($T)"
suggestion: Use time.Since.
references:
  - https://pkg.go.dev/time#Since
enabled: true

---
id: go.style.bytes-equal
title: Use bytes.Equal
category: style
severity: INFO
description: Comparing bytes.Compare with zero is clearer as bytes.Equal.
pattern: "bytes.Compare($A, $B) == 0"
fix: "bytes.Equal($A, $B)"
suggestion: Use bytes.Equal.
references:
  - https://pkg.go.dev/bytes#Equal
enabled: true

---
id: go.correctness.self-assignment
title: Self Assignment
category: correctness
severity: LOW
description: A variable is assigned to itself, which has no effect and usually hides a typo.
pattern: "$X = $X"
suggestion: Assign the intended value or remove the statement.
enabled: true
