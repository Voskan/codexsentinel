# Scan defaults for Go source. Optional network dependency checks are opt-in.
version: 1
scan:
  include_tests: false
  include_vendor: false
  include_generated: false
  excluded_paths: [vendor, testdata, node_modules, .git]
  max_file_size_bytes: 10485760
  supported_extensions: [.go]
  concurrency: 0 # Use the available CPUs.
  enable_cache: true # Reuse per-package results of unchanged packages.
  cache_dir: "" # Empty: $CODEXSENTINEL_CACHE_DIR or the user cache directory.
rules:
  enabled: ["*"]
  disabled: []
  severity_overrides: {}
  rule_paths: []
  rule_files: []
taint:
  enable: true
  interprocedural: true
  custom_sources: []
  custom_sinks: []
  custom_sanitizers: []
architecture:
  enable: true
  layers: {}
  allowed_deps: {}
  check_cycles: true
  check_god_structs: true
  check_boundaries: true
  god_struct_max_methods: 15
  god_struct_max_fields: 20
metrics:
  enable: true
  # Project policy: the default limit is 15; this repository allows up to 30
  # (the golangci-lint gocyclo default) for AST visitors and rule tables.
  max_cyclomatic: 30
  max_function_loc: 80
  max_file_loc: 600
  min_duplicate_loc: 10
  enable_duplication: true
  enable_dead_code: true
  enable_globals: true
dependencies:
  enable: false
  check_vulnerabilities: true
  check_reachability: true
  # Offline check against the capability lock file; skipped when the file is absent.
  check_capabilities: true
  capability_lockfile: .codexsentinel.caps.json
  check_licenses: true
  allow_licenses: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0]
  deny_licenses: [AGPL-3.0, GPL-3.0, GPL-2.0, SSPL-1.0, BSL-1.1]
  # Offline go.mod checks run on every scan: typosquatted module names,
  # local replace directives, missing go.sum checksums and module policy.
  check_provenance: true
  check_hygiene: true
  # With check_vulnerabilities, the module proxy is asked for versions
  # younger than this many days, deprecated modules and retracted versions.
  min_module_age_days: 7
  allowed_prefixes: []
  denied_prefixes: []
suppression:
  ignore_file: .codexsentinel.ignore
  enable_inline_ignore: true
  require_ignore_reason: true
  min_confidence: 0.5
report:
  formats: [sarif]
  output_dir: scan_reports
  fail_on_severity: "" # Set a severity threshold for CI, or use --strict.
