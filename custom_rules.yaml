# Example custom rules. Load them with:
#
#   rules:
#     rule_files: ["custom_rules.yaml"]
#
# Patterns are Go code. $NAME (or {{name}}) is a metavariable that matches any
# expression; a repeated metavariable must match the same code; $... matches
# any number of call arguments. Filters narrow where a match is reported:
#   import     - the file imports one of `include`
#   package    - the package name/path matches `allow` and not `exclude` (globs)
#   type       - metavariable `var` has one of the types in `include`
#   non_const  - metavariable `var` is not a compile-time constant
#   regex      - the source of metavariable `var` matches `include`, not `exclude`
# not_pattern suppresses a match that contains the given pattern, and fix
# rewrites the match (applied with `codex-cli scan --fix`).

rules:
  - id: CUSTOM001
    title: SQL Statement Built with fmt.Sprintf
    category: security
    severity: HIGH
    cwe: CWE-89
    description: A SQL statement is formatted with %s or %v, which invites injection.
    match:
      pattern: "fmt.Sprintf($QUERY, $...)"
      filters:
        - type: regex
          var: $QUERY
          include: ['(?i)^["`]\s*(select|insert|update|delete)\b[^"`]*%[sv]']
    suggestion: Use placeholders ($1 or ?) and pass values as query arguments.
    references:
      - https://go.dev/doc/database/sql-injection

  - id: CUSTOM002
    title: log.Fatal in Library Code
    category: reliability
    severity: LOW
    description: Library packages should return errors instead of exiting the process.
    match:
      pattern: "log.Fatalf($...)"
      filters:
        - type: package
          exclude: ["main"]
    suggestion: Return the error to the caller and let main decide how to exit.
